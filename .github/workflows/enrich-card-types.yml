name: Enrich card types

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-card-types.yml'
      - 'data/marvel-*.json'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add card types from Scryfall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import re
          import time
          import urllib.request
          import unicodedata

          headers = {
              "User-Agent": "MTG-Jumpstart-Cube-Library/1.0 (GitHub Actions)",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def norm(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(ch for ch in value if not unicodedata.combining(ch))
              value = value.replace("’", "'").replace("‘", "'")
              value = value.replace("–", "-").replace("—", "-")
              return re.sub(r"\s+", " ", value).strip().casefold()

          paths = sorted(pathlib.Path("data").glob("marvel-*.json"))
          datasets = {path: json.loads(path.read_text(encoding="utf-8")) for path in paths}
          names = sorted({
              item["name"]
              for data in datasets.values()
              for deck in data.get("decks", [])
              for item in deck.get("cards", [])
          })

          by_name = {}
          not_found = []
          for start in range(0, len(names), 75):
              batch = names[start:start + 75]
              payload = json.dumps({"identifiers": [{"name": name} for name in batch]}).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.scryfall.com/cards/collection",
                  data=payload,
                  headers=headers,
                  method="POST",
              )
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              for card in result.get("data", []):
                  by_name[norm(card["name"])] = card
              not_found.extend(item.get("name", str(item)) for item in result.get("not_found", []))
              time.sleep(0.12)

          def primary_type(type_line):
              # Creature takes precedence for Artifact/Enchantment Creatures so
              # sorting remains useful when physically rebuilding a halfdeck.
              order = [
                  "Creature", "Planeswalker", "Battle", "Sorcery", "Instant",
                  "Enchantment", "Artifact", "Land"
              ]
              for card_type in order:
                  if card_type in type_line:
                      return card_type
              return "Other"

          unresolved = []
          touched = 0
          for path, data in datasets.items():
              changed = False
              for deck in data.get("decks", []):
                  for item in deck.get("cards", []):
                      card = by_name.get(norm(item["name"]))
                      if not card:
                          unresolved.append(f"{path}: {item['name']}")
                          continue
                      category = primary_type(card.get("type_line", ""))
                      if item.get("type") != category:
                          item["type"] = category
                          changed = True
                  for item in deck.get("lands", []):
                      if item.get("type") != "Land":
                          item["type"] = "Land"
                          changed = True
              if changed:
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  touched += 1

          if not_found:
              print("Scryfall not_found entries:", sorted(set(not_found)))
          if unresolved:
              print("Unresolved card names:")
              for item in unresolved:
                  print(" -", item)
              raise SystemExit(1)

          print(f"Resolved {len(by_name)} unique cards; updated {touched} Marvel data files.")
          PY

      - name: Commit enriched data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/marvel-*.json
          if git diff --cached --quiet; then
            echo 'No type metadata changed.'
            exit 0
          fi
          git commit -m 'Add card type metadata [skip ci]'
          git push
